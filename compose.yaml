services:
  gateway:
    build: .
    environment:
      PORT: 8080
      VLLM_BASE_URL: http://vllm:8000
      API_KEY: ${API_KEY:-}
    ports:
      - "${PORT:-8080}:8080"
    depends_on:
      vllm:
        condition: service_healthy
    restart: unless-stopped

  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:latest}
    command:
      - --model
      - ${MODEL:-Qwen/Qwen3-0.6B}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --served-model-name
      - ${SERVED_MODEL_NAME:-assistant}
      - --tensor-parallel-size
      - ${TENSOR_PARALLEL_SIZE:-1}
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /root/.cache/huggingface
    volumes:
      - ${MODEL_DIR:-./models}:/models:ro
      - hf-cache:/root/.cache/huggingface
    ipc: host
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 120s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  hf-cache:
